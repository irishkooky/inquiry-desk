<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>inquiry-desk</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 8rem; }
    button { margin-top: 0.75rem; padding: 0.5rem 1rem; }
    #result { margin-top: 1rem; padding: 0.75rem; background: #f4f4f4; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>inquiry-desk</h1>
  <p>問い合わせ文を貼ると、仮の分類（料金 / 不具合 / その他）を返します。</p>
  <textarea id="text" placeholder="例: 請求金額がおかしいです"></textarea>
  <div><button id="run" type="button">分類する</button></div>
  <div id="result" hidden></div>
  <script>
    const textEl = document.getElementById('text');
    const resultEl = document.getElementById('result');
    document.getElementById('run').addEventListener('click', async () => {
      const text = textEl.value;
      const res = await fetch('/api/classify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      resultEl.hidden = false;
      resultEl.textContent = res.ok
        ? `分類: ${data.category}`
        : `エラー: ${data.error || res.status}`;
    });
  </script>
</body>
</html>
